name: Release

# main への push ごとに release-please が Release PR を作る・更新する。
# Release PR をマージするとタグと draft の Release ができ、macOS ランナーがタグからビルド・検査して
# zip と SHA-256 を添付してから公開し、最後に homebrew-tap へ Cask の更新を知らせる
# （openspec/specs/distribution）。macOS ランナーを使うのはこのワークフローだけ（CLAUDE.md）。
# App の秘密鍵は main に限定した Environment `release` にだけ置く（.claude/rules/security.md）。

on:
  push:
    branches: [main]
  # draft のまま残った Release を、タグを指定してビルドし直す（push の実行をやり直せないとき）
  workflow_dispatch:
    inputs:
      tag:
        description: "draft のまま残った Release のタグ（vX.Y.Z）"
        required: true

permissions:
  contents: read

env:
  # ランナーの Xcode。イメージが変わって見つからなくなったら、手元の Xcode とそろえて上げる
  XCODE_APP: /Applications/Xcode_27.2_beta_2.app
  XCODE_BUILD: 27B5028f

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # 待っている実行が新しい push で置き換えられても、マージ済みで未リリースの Release PR は次の実行が拾う
    concurrency:
      group: release-please
      cancel-in-progress: false
    timeout-minutes: 10
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # App のトークンで Release PR を作ると、その PR でも CI（lint）が走る
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: mewbell
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  build:
    needs: release-please
    # workflow_dispatch では release-please を飛ばすので、always() で needs の結果に関わらず条件を評価する
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: xcode-27
    timeout-minutes: 60
    # release_created はリリースを作った実行にしか出ないので、ビルドはタグごとに分けて取り消されないようにする
    concurrency:
      group: release-build-${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      # zip の build provenance attestation を作る（homebrew-tap が gh attestation verify で確かめる）
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグの形式が vX.Y.Z ではありません" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"

      # 公開済みのとき（公開の後の手順だけが失敗してやり直したとき）は、ビルドも attestation も添付もせず、
      # tap への知らせだけを送り直す。利用者が取った zip と Cask の SHA-256 を変えないため
      - id: state
        name: Check the release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          case "$draft" in
            true) ;;
            false)
              echo "$TAG は公開済みなので、tap への知らせだけを送ります"
              echo "published=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "$TAG の状態を読めませんでした: $draft" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.state.outputs.published != 'true'
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check Xcode
        if: steps.state.outputs.published != 'true'
        run: |
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "$XCODE_APP がありません。ランナーのイメージを確かめて XCODE_APP と XCODE_BUILD を上げてください" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >>"$GITHUB_ENV"
          xcodebuild -version
          actual="$(xcodebuild -version | sed -n 's/^Build version //p')"
          if [[ "$actual" != "$XCODE_BUILD" ]]; then
            echo "Xcode のビルド番号が $XCODE_BUILD ではありません: $actual" >&2
            exit 1
          fi
          # Cask の雛形の確認に使う。長いビルドの後で気づかないよう、先に確かめる
          command -v brew
          brew help trust >/dev/null

      # 数秒で終わるので、時間のかかるビルドより先に検査そのものを確かめる
      - name: Test verify_app
        if: steps.state.outputs.published != 'true'
        run: bash scripts/tests/verify-app-test.sh

      # Debug の警告をエラー扱いにしたビルドを兼ねる。Release の分は package-release.sh が行う
      - name: Test with warnings as errors
        if: steps.state.outputs.published != 'true'
        run: xcodebuild -project Mewbell.xcodeproj -scheme Mewbell MEWBELL_WARNINGS_AS_ERRORS=YES test

      - name: Package
        if: steps.state.outputs.published != 'true'
        run: bash scripts/package-release.sh "$VERSION"

      # homebrew-tap はこのタグの雛形から Cask を作るので、公開する前に同じ形で確かめる
      - name: Check the cask template
        if: steps.state.outputs.published != 'true'
        run: |
          tap="$RUNNER_TEMP/homebrew-check"
          mkdir -p "$tap/Casks"
          sha256="$(cut -d ' ' -f 1 "build/dist/$VERSION/Mewbell-$VERSION.zip.sha256")"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$sha256/g" \
            packaging/homebrew/mewbell.rb.template >"$tap/Casks/mewbell.rb"
          git -C "$tap" init -q
          git -C "$tap" add -A
          git -C "$tap" -c user.name=ci -c user.email=ci@localhost commit -qm check
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap yshrsmz/check "$tap"
          brew trust --tap yshrsmz/check
          brew style --cask yshrsmz/check/mewbell
          brew audit --cask --strict yshrsmz/check/mewbell

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.state.outputs.published != 'true'
        with:
          subject-path: build/dist/${{ env.VERSION }}/Mewbell-${{ env.VERSION }}.zip

      # 添付してから公開する。ここまでのどこかで失敗したら Release は draft のまま残る
      - name: Upload and publish
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "build/dist/$VERSION/Mewbell-$VERSION.zip" \
            "build/dist/$VERSION/Mewbell-$VERSION.zip.sha256"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # tap へ知らせるトークンは homebrew-tap の Contents の書き込みだけに絞る（dispatch に要る）
      - id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: yshrsmz
          repositories: homebrew-tap
          permission-contents: write

      - name: Notify homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          gh api repos/yshrsmz/homebrew-tap/dispatches \
            -f event_type=mewbell-released \
            -f "client_payload[version]=$VERSION"
