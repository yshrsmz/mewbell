name: Release

# main への push ごとに release-please が Release PR を作る・更新する。
# Release PR をマージするとタグと draft の Release ができ、macOS ランナーがタグからビルド・検査して
# zip・SHA-256・Cask を作り、別のジョブが attestation を付けて添付してから公開し、最後に homebrew-tap へ
# Cask の更新を知らせる（openspec/specs/distribution）。
# テストやビルドのコードは、OIDC トークン・書き込み権限・App の秘密鍵を持たないジョブ（build）でだけ動かす。
# App の秘密鍵は main に限定した Environment `release` にだけ置く（.claude/rules/security.md）。

on:
  push:
    branches: [main]
  # draft のまま残った Release を、タグを指定してビルドし直す（push の実行をやり直せないとき）
  workflow_dispatch:
    inputs:
      tag:
        description: "draft のまま残った Release のタグ（vX.Y.Z）"
        required: true

permissions:
  contents: read

env:
  # ランナーの Xcode。イメージが変わって見つからなくなったら、手元の Xcode とそろえて上げる
  XCODE_APP: /Applications/Xcode_27.2_beta_2.app
  XCODE_BUILD: 27B5028f

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    # 待っている実行が新しい push で置き換えられても、マージ済みで未リリースの Release PR は次の実行が拾う
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # App のトークンで Release PR を作ると、その PR でも CI（lint）が走る
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: mewbell
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # 対象のタグを決め、Release が公開済みかを確かめる。公開済みのとき（公開の後の手順だけが失敗してやり直したとき）は、
  # ビルドも attestation も添付もせず、tap への知らせだけを送り直す（利用者が取った zip と Cask を変えない）
  prepare:
    needs: release-please
    # workflow_dispatch では release-please を飛ばすので、cancelled 以外は needs の結果に関わらず条件を評価する
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # draft の Release は書き込み権限が無いと読めない。このジョブはコードを checkout しない
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      published: ${{ steps.state.outputs.published }}
    steps:
      - id: tag
        name: Validate the tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグの形式が vX.Y.Z ではありません" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >>"$GITHUB_OUTPUT"

      - id: state
        name: Check the release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          case "$draft" in
            true) echo "published=false" >>"$GITHUB_OUTPUT" ;;
            false)
              echo "$TAG は公開済みなので、tap への知らせだけを送ります"
              echo "published=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "$TAG の状態を読めませんでした: $draft" >&2
              exit 1
              ;;
          esac

  # テスト・ビルド・検査をして配布物を作る。書き込み権限・OIDC トークン・シークレットを持たない
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.published == 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    # release_created はリリースを作った実行にしか出ないので、タグごとに分けて後の push で取り消されないようにする
    concurrency:
      group: release-build-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Check Xcode
        run: |
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "$XCODE_APP がありません。ランナーのイメージを確かめて XCODE_APP と XCODE_BUILD を上げてください" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >>"$GITHUB_ENV"
          xcodebuild -version
          actual="$(xcodebuild -version | sed -n 's/^Build version //p')"
          if [[ "$actual" != "$XCODE_BUILD" ]]; then
            echo "Xcode のビルド番号が $XCODE_BUILD ではありません: $actual" >&2
            exit 1
          fi
          # Cask の確認に使う。長いビルドの後で気づかないよう、先に確かめる
          command -v brew
          brew help trust >/dev/null

      # 数秒で終わるので、時間のかかるビルドより先に検査そのものを確かめる
      - name: Test verify_app
        run: bash scripts/tests/verify-app-test.sh

      # Debug の警告をエラー扱いにしたビルドを兼ねる。Release の分は package-release.sh が行う
      - name: Test with warnings as errors
        run: xcodebuild -project Mewbell.xcodeproj -scheme Mewbell MEWBELL_WARNINGS_AS_ERRORS=YES test

      - name: Package
        run: bash scripts/package-release.sh "$VERSION"

      # homebrew-tap はこの Cask をそのまま使う（attestation と version・sha256 を確かめてから）
      - name: Render and check the cask
        run: |
          dist="build/dist/$VERSION"
          sha256="$(cut -d ' ' -f 1 "$dist/Mewbell-$VERSION.zip.sha256")"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$sha256/g" \
            packaging/homebrew/mewbell.rb.template >"$dist/mewbell.rb"
          tap="$RUNNER_TEMP/homebrew-check"
          mkdir -p "$tap/Casks"
          cp "$dist/mewbell.rb" "$tap/Casks/mewbell.rb"
          git -C "$tap" init -q
          git -C "$tap" add -A
          git -C "$tap" -c user.name=ci -c user.email=ci@localhost commit -qm check
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap yshrsmz/check "$tap"
          brew trust --tap yshrsmz/check
          brew style --cask yshrsmz/check/mewbell
          brew audit --cask --strict yshrsmz/check/mewbell

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: build/dist/${{ needs.prepare.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  # attestation を付けて添付し、公開して、tap に知らせる。リポジトリのコードは checkout も実行もしない
  publish:
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && (
        needs.build.result == 'success' || needs.prepare.outputs.published == 'true'
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      # zip と Cask の build provenance attestation を作る（homebrew-tap が gh attestation verify で確かめる）
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # prepare の後に別の実行が公開したかもしれない（同じタグの実行が重なった、公開の後の手順だけを
      # やり直した）ので、添付の直前にもう一度確かめる。公開済みなら添付を差し替えずに知らせだけを送る
      - name: Check the release state again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          case "$draft" in
            true) echo "PUBLISHED=false" >>"$GITHUB_ENV" ;;
            false)
              echo "$TAG は公開済みなので、添付を差し替えずに tap への知らせだけを送ります"
              echo "PUBLISHED=true" >>"$GITHUB_ENV"
              ;;
            *)
              echo "$TAG の状態を読めませんでした: $draft" >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISHED == 'false'
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Check the artifact
        if: env.PUBLISHED == 'false'
        working-directory: dist
        run: |
          ls -la
          sha256sum -c "Mewbell-$VERSION.zip.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISHED == 'false'
        with:
          subject-path: |
            dist/Mewbell-${{ needs.prepare.outputs.version }}.zip
            dist/mewbell.rb

      # 添付してから公開する。ここまでのどこかで失敗したら Release は draft のまま残る
      - name: Upload and publish
        if: env.PUBLISHED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/Mewbell-$VERSION.zip" \
            "dist/Mewbell-$VERSION.zip.sha256" \
            dist/mewbell.rb
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # tap へ知らせるトークンは homebrew-tap の Contents の書き込みだけに絞る（dispatch に要る）
      - id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: yshrsmz
          repositories: homebrew-tap
          permission-contents: write

      - name: Notify homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          gh api repos/yshrsmz/homebrew-tap/dispatches \
            -f event_type=mewbell-released \
            -f "client_payload[version]=$VERSION"
