name: CI

# macOS ランナーは高価なので、CI は ubuntu で動く範囲（lint と OpenSpec の検証）だけにする。
# xcodebuild のビルドとテストは手元で実行する（README・tasks.md の最終確認を参照）。
# macOS ランナーを使うのはリリースのワークフロー（release.yml）だけ。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main への push は 1 コミットずつ結果を残すため、キャンセルするのは PR だけにする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # どちらも digest で固定する。swift-format は Swift ツールチェーンに含まれ、
      # swiftlint の公式イメージには実行に必要な SourceKit が含まれる
      SWIFT_IMAGE: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
      SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please が書き換えるのは印の中の MARKETING_VERSION だけ。Xcode が project.xcproj を保存し直して
      # コメントが消えたり、General タブの Version / Build がターゲットに値を書いたりすると、リリースのジョブが
      # タグを作った後でバージョンの不一致で失敗するので、PR のうちに気づく
      - name: Check the version settings
        run: |
          project=Mewbell.xcodeproj/project.xcproj
          block="$(sed -n '/x-release-please-start-version/,/x-release-please-end/p' "$project")"
          if ! grep -q 'x-release-please-end' "$project" ||
            ! grep -Eq '"MARKETING_VERSION": "[0-9]+\.[0-9]+\.[0-9]+"' <<<"$block"; then
            echo "$project の release-please の印（start と end）の中に MARKETING_VERSION（X.Y.Z）がありません" >&2
            exit 1
          fi
          # [config=Release] のような構成ごとの上書きも数える
          if [[ "$(grep -c '"MARKETING_VERSION[":[]' "$project")" != 1 ]] ||
            [[ "$(grep -c '"CURRENT_PROJECT_VERSION[":[]' "$project")" != 1 ]] ||
            ! grep -Fq '"CURRENT_PROJECT_VERSION": "$(MARKETING_VERSION)"' "$project"; then
            echo "$project のバージョンは、プロジェクトの設定の MARKETING_VERSION 1 か所だけに書き、CURRENT_PROJECT_VERSION は \$(MARKETING_VERSION) にします" >&2
            exit 1
          fi

      - name: swift-format
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SWIFT_IMAGE"
          swift-format lint --strict --recursive Mewbell MewbellTests

      - name: swiftlint
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SWIFTLINT_IMAGE"
          swiftlint lint --strict --quiet

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.16
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518 # mise-v2026.9.16-linux-x64
          install_args: node pnpm

      - name: Validate OpenSpec
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec openspec validate --all --strict
