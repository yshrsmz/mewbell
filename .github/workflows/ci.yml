name: CI

# macOS ランナーは高価なので、CI は ubuntu で動く範囲（lint と OpenSpec の検証）だけにする。
# xcodebuild のビルドとテストは手元で実行する（README・tasks.md の最終確認を参照）。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main への push は 1 コミットずつ結果を残すため、キャンセルするのは PR だけにする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # swift-format と、swiftlint が使う SourceKit は Swift ツールチェーンに含まれる
    container:
      image: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.16
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518 # mise-v2026.9.16-linux-x64

      - name: Lint
        run: bash scripts/lint.sh

      - name: Validate OpenSpec
        run: |
          npm ci --ignore-scripts
          npx openspec validate --all --strict
