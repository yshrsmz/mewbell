name: CI

# macOS ランナーは高価なので、CI は ubuntu で動く範囲（lint と OpenSpec の検証）だけにする。
# xcodebuild のビルドとテストは手元で実行する（README・tasks.md の最終確認を参照）。
# macOS ランナーを使うのはリリースのワークフロー（release.yml）だけ。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main への push は 1 コミットずつ結果を残すため、キャンセルするのは PR だけにする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # どちらも digest で固定する。swift-format は Swift ツールチェーンに含まれ、
      # swiftlint の公式イメージには実行に必要な SourceKit が含まれる
      SWIFT_IMAGE: swift:6.4.1-noble@sha256:64f2c54113c2d5c234ed8fa2f59684b5d1ab3c4802657031679b4a8d6308a2dd
      SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please が書き換えるのは印の中の MARKETING_VERSION だけ。Xcode が project.xcproj を保存し直して
      # コメントが消えたり、General タブの Version / Build がターゲットに値を書いたりすると、リリースのジョブが
      # タグを作った後でバージョンの不一致で失敗するので、PR のうちに気づく
      - name: Check the version settings
        run: |
          project=Mewbell.xcodeproj/project.xcproj
          block="$(sed -n '/x-release-please-start-version/,/x-release-please-end/p' "$project")"
          if ! grep -q 'x-release-please-end' "$project" ||
            ! grep -Eq '"MARKETING_VERSION": "[0-9]+\.[0-9]+\.[0-9]+"' <<<"$block"; then
            echo "$project の release-please の印（start と end）の中に MARKETING_VERSION（X.Y.Z）がありません" >&2
            exit 1
          fi
          # [config=Release] のような構成ごとの上書きも数える
          if [[ "$(grep -c '"MARKETING_VERSION[":[]' "$project")" != 1 ]] ||
            [[ "$(grep -c '"CURRENT_PROJECT_VERSION[":[]' "$project")" != 1 ]] ||
            ! grep -Fq '"CURRENT_PROJECT_VERSION": "$(MARKETING_VERSION)"' "$project"; then
            echo "$project のバージョンは、プロジェクトの設定の MARKETING_VERSION 1 か所だけに書き、CURRENT_PROJECT_VERSION は \$(MARKETING_VERSION) にします" >&2
            exit 1
          fi

      - name: swift-format
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SWIFT_IMAGE"
          swift-format lint --strict --recursive Mewbell MewbellTests

      - name: swiftlint
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SWIFTLINT_IMAGE"
          swiftlint lint --strict --quiet

      - name: Check docs/architecture.md
        run: |
          bash scripts/check-architecture.sh
          bash scripts/tests/check-architecture-test.sh

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # タグと同じ v 付きで書く。Renovate は sha256 の更新でこの値をそのままタグ名にしてリリースを引くので、
          # v が無いと 404 になる。mise-action は先頭の v を取り除いてから使う
          version: v2026.9.16
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518 # mise-v2026.9.16-linux-x64
          install_args: node pnpm

      - name: Install the OpenSpec CLI
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate OpenSpec
        run: pnpm exec openspec validate --all --strict

      # .claude/ の OpenSpec のスキルとコマンドは CLI が生成する。Renovate が CLI だけを上げると生成物が古い版のまま残るので、
      # 固定した版で生成し直して差分が出ないことを確かめる。validate が落ちても回す
      - name: Check the generated OpenSpec files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          OPENSPEC_NO_UPDATE_CHECK: "1"
          DO_NOT_TRACK: "1"
        run: |
          pnpm exec openspec update --force
          # CLI が .claude/ の外に書くようになっても拾えるよう、パスで絞らない
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            # 未追跡のファイルも中身ごと出す
            git add -N .
            git diff
            echo "::error::OpenSpec の生成物が CLI の出力と一致しません。手元で pnpm exec openspec update を実行してコミットします（生成物を手で直さない）"
            exit 1
          fi
          # CLI が生成物を見つけられずに何も書かずに終わると、上の検査は通ってしまう。版でも確かめる（コマンドは版を持たない）
          shopt -s nullglob
          skills=(.claude/skills/openspec-*/SKILL.md)
          if [[ "${#skills[@]}" -eq 0 ]]; then
            echo "::error::OpenSpec のスキルが .claude/skills/openspec-*/ に見つかりません"
            exit 1
          fi
          version="$(pnpm exec openspec --version)"
          stale="$(grep -L -F "generatedBy: \"$version\"" "${skills[@]}" || true)"
          if [[ -n "$stale" ]]; then
            echo "$stale"
            echo "::error::OpenSpec のスキルが CLI $version で生成されていません。手元で pnpm exec openspec update を実行してコミットします"
            exit 1
          fi
