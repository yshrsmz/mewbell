# 整形は swift-format に任せ、swiftlint はそれ以外の静的チェックだけを行う。
included:
  - Mewbell
  - MewbellTests

disabled_rules:
  # swift-format と重なる整形系のルール
  - trailing_whitespace
  - trailing_comma
  - opening_brace
  - line_length
  - vertical_whitespace
  - colon
  - comma
  - statement_position
  - closure_parameter_position
  - sorted_imports  # import の並びは swift-format の OrderedImports に任せる

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where

# 正規表現で守れる約束。message の ID は docs/architecture.md の原則
custom_rules:
  no_print:
    name: "No print or NSLog"
    regex: '\b(debugPrint|print|NSLog|dump)\(|\bFileHandle\.standardError\b'
    included: 'Mewbell/'  # テストは dump(_:to:) で文字列にして確かめる
    match_kinds: identifier
    message: "ログは Logger(category:) で出す（A11、security.md）"
    severity: error
  no_thread_sleep:
    name: "No Thread.sleep"
    regex: '\bThread\.sleep\b'
    message: "同期的に待たない。actor が塞がる。待たせるときは async で中断させる（A12）"
    severity: error
  no_shared_urlsession:
    name: "No URLSession.shared"
    regex: '\bURLSession\.shared\b'
    included: 'Mewbell/'
    message: "キャッシュを使わない設定の HTTPTransport を使う（security.md）"
    severity: error
  ui_frameworks_outside_ui:
    name: "UI frameworks outside UI"
    regex: '^\s*(@\w+\s+)*import\s+(\w+\s+)?(SwiftUI|AppKit|Cocoa)\b'
    included: 'Mewbell/'
    excluded: 'Mewbell/(UI|App)/|Mewbell/Polling/NotificationStore\.swift'
    message: "SwiftUI・AppKit（Cocoa を含む）を import するのは UI/ と App/ だけ（A1）"
    severity: error
  authorization_header_outside_client:
    name: "Authorization header outside the API client"
    regex: '(?i)"authorization"'
    included: 'Mewbell/'
    message: "Authorization を付けて送るのは GitHubAPIClient.send だけ（A6、security.md）"
    severity: error
  fixed_font_size:
    name: "Fixed font size"
    regex: '\b(system|custom|systemFont)\([^)]*\b(size|ofSize):'
    included: 'Mewbell/(UI|App)/'
    message: "書体の大きさはテキストスタイルで指定し、ポイント数を書かない（A4）"
    severity: error
